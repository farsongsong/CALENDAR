<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2026 Photo Calendar</title>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="controls">
  <button id="saveImage">배경화면 저장</button>
  <button id="savePDF">인쇄용 PDF 저장</button>
</div>

<div id="calendar-canvas">
  <div class="header-area">
    <span class="star">☆</span>
    <h1 class="title">2026</h1>
    <span class="star">☆</span>
  </div>
  <div class="calendar-grid" id="calendar"></div>
</div>

<div id="cropper-modal">
  <div class="modal-content">
    <div class="img-container">
      <img id="cropper-image">
    </div>
    <div class="modal-buttons">
      <button id="crop-cancel">취소</button>
      <button id="crop-confirm">적용하기</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="script.js"></script>
</body>
</html>
